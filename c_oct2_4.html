<!DOCTYPE html>
<html>
    <head>
        <title>Image Size Change</title>
        <style>
            #image{
                width:20vw;
            }
        </style>

    </head>
    <body>
        <img id="image" src="html image.jpeg" alt="">
    </body>
    <script>
        document.querySelector("#image").addEventListener("mouseover", changesize);

        document.querySelector("#image").addEventListener("mouseout", originalsize);

        function changesize(event) {
            event.target.style.width = "30vw";
        }

        function originalsize(event) {
            event.target.style.width = "20vw";
        }
        
    </script>

</html>
